<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SEVA — Smart Heathcare Scheduler</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap + icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --accent: #0d6efd;
      --danger: #dc3545;
      --muted: #6c757d;
      --card-bg: #ffffff;
      --glass: rgba(255,255,255,0.72);
      --shadow: 0 6px 20px rgba(8, 15, 52, 0.06);
      --radius: 14px;
    }
    html,body { height:100%; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: linear-gradient(180deg,#f3f7ff 0%, #f6f9ff 100%); color:#0b1a2b; }
    .container-main { max-width:1200px; margin:28px auto; }
    .card-app { border: none; border-radius: var(--radius); background: var(--card-bg); box-shadow: var(--shadow); }
    h1.app-title { font-weight:800; color:var(--accent); margin-bottom:6px; letter-spacing: -0.4px; }
    .sub { color:var(--muted); font-size:0.95rem; margin-bottom:14px; }

    /* left column */
    .controls { padding:22px; }
    .form-label { font-weight:600; font-size:0.95rem; color:#223; }
    .btn-primary { background: linear-gradient(90deg,var(--accent), #0b5ed7); border: none; box-shadow: 0 6px 16px rgba(13,110,253,0.12); }
    .toggle-text { font-size:0.92rem; color:var(--muted); }

    /* doctors list */
    .doctor-card { display:flex; gap:12px; align-items:center; padding:12px; border-radius:12px; background: linear-gradient(180deg,#fff,#fbfdff); transition:transform .18s ease, box-shadow .18s ease; }
    .doctor-card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px rgba(8,15,52,0.08); }
    .doc-avatar { width:56px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:700; color:white; background: linear-gradient(180deg,#6c5ce7,#3f37c9); font-size:1.05rem; }
    .doc-info { flex:1; min-width:0; }
    .doc-name { font-weight:700; font-size:0.98rem; color:#07203a; }
    .doc-spec { color:var(--muted); font-size:0.88rem; }
    .handling { color:var(--danger); font-weight:700; font-size:0.78rem; }

    .load-bar { height:8px; background:#eef3ff; border-radius:999px; overflow:hidden; margin-top:8px; }
    .load-bar > i { display:block; height:100%; background: linear-gradient(90deg,#00c6ff,#007bff); width:10%; transition: width .5s ease; }

    /* slots grid */
    .slot-tile { padding:10px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; transition:transform .12s ease, box-shadow .12s ease; }
    .slot-tile.available { background: linear-gradient(180deg,#f7fff8,#f0fff3); border:1px solid #e6f8ec; }
    .slot-tile.booked { background: linear-gradient(180deg,#fff8f8,#fff3f3); border:1px solid #ffecec; opacity:0.98; }
    .slot-tile.emer { background: linear-gradient(90deg,#ffeef0,#ffebf0); border:1px solid #ffd6dd; }
    .slot-tile:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(7,18,43,0.06); }

    .slot-time { font-weight:700; color:#0a2540; }
    .slot-status { font-size:0.82rem; color:var(--muted); }

    /* appointments list */
    .appt-row { padding:12px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; gap:12px; transition: background .12s ease; }
    .appt-row.emergency { border-left:4px solid var(--danger); background: linear-gradient(90deg,#fff8f9,#fff8f9); }
    .appt-row.normal { background: #fff; border:1px solid #f1f4ff; }
    .small-muted { font-size:0.85rem; color:var(--muted); }

    /* live clock */
    .live-clock { font-weight:700; color:#0b2a4a; }

    /* responsive tweaks */
    @media (max-width: 900px) {
      .doctor-card { gap:10px; }
      .doc-avatar { width:48px; height:48px; }
    }
  </style>
</head>
<body>
  <div class="container-main">
    <div class="card card-app p-3">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h1 class="app-title">SEVA - Smart Healthcare Scheduler</h1>
          <div class="sub">Smart bookings • IST time • Emergency-first handling</div>
        </div>
        <div class="text-end">
          <div class="small-muted">Times shown in</div>
          <div class="live-clock" id="istClock">IST — --:--:--</div>
          <div class="small-muted" style="font-size:0.8rem">Auto-refresh every 6s</div>
        </div>
      </div>

      <div class="row gx-3 gy-3">
        <!-- LEFT: Controls -->
        <div class="col-lg-5">
          <div class="card p-3 controls">
            <div class="mb-3">
              <label class="form-label">Search doctors / filter by specialty</label>
              <div class="d-flex gap-2">
                <input id="searchBox" class="form-control" placeholder="Search name or specialty (e.g. Cardio)">
                <select id="specialtyFilter" class="form-select" style="max-width:180px;">
                  <option value="">All specialties</option>
                </select>
              </div>
            </div>

            <div id="doctorsList" class="d-flex flex-column gap-2 mb-3" style="max-height:320px; overflow:auto; padding-right:6px;"></div>

            <hr>

            <div class="mb-2">
              <label class="form-label">Select Doctor</label>
              <select id="doctorSelect" class="form-select"></select>
              <div id="doctorHandling" class="form-text text-danger"></div>
            </div>

            <div class="mb-2">
              <label class="form-label">Choose Slot (normal booking)</label>
              <div id="slotSelectWrap">
                <select id="slotSelect" class="form-select mb-2"></select>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label">Patient name</label>
              <input id="patient" class="form-control" placeholder="Enter patient name">
            </div>

            <div class="form-check form-switch mb-3">
              <input id="isEmergency" class="form-check-input" type="checkbox">
              <label class="form-check-label toggle-text" for="isEmergency">Emergency booking (auto-assign immediate IST time)</label>
            </div>

            <div class="d-flex gap-2 align-items-center">
              <button id="bookBtn" class="btn btn-primary btn-lg px-4"><i class="bi bi-calendar-plus me-2"></i>Book Appointment</button>
              <div id="msg" class="text-muted small"></div>
            </div>
          </div>
        </div>

        <!-- RIGHT: Appointments + slots -->
        <div class="col-lg-7">
          <div class="mb-3 card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="mb-0">Upcoming / Active Appointments</h5>
              <div><button id="refreshBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise"></i> Refresh</button></div>
            </div>
            <div id="appointmentsList" style="max-height:280px; overflow:auto;"></div>
          </div>

          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="mb-0">Doctor Slots (select doctor to view)</h6>
              <div class="small-muted">Green = available • Red = booked • Pink = emergency</div>
            </div>
            <div id="slotsGrid" class="row row-cols-1 row-cols-md-2 g-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Emergency modal (assignment) -->
  <div class="modal fade" id="emergencyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <div id="emergencyModalBody"></div>
          <div class="text-end mt-3">
            <button class="btn btn-sm btn-primary" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
